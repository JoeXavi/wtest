name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and sync to S3
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_WEB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build web
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '/api' }}
          VITE_API_TOKEN: ${{ secrets.VITE_API_TOKEN }}
          VITE_PSP_PUBLIC_KEY: ${{ vars.VITE_PSP_PUBLIC_KEY }}
          VITE_PSP_TOKENIZATION_URL: ${{ vars.VITE_PSP_TOKENIZATION_URL }}
        run: pnpm build

      - name: Sync assets (immutable)
        run: |
          aws s3 sync apps/web/dist/assets "s3://${{ vars.WEB_BUCKET_NAME }}/assets" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync HTML and other files (no-cache)
        run: |
          aws s3 sync apps/web/dist "s3://${{ vars.WEB_BUCKET_NAME }}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
